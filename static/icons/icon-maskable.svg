<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="32%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#ff5cf0"></stop>
      <stop offset="35%" stop-color="#a64bff"></stop>
      <stop offset="72%" stop-color="#5b2bd9"></stop>
      <stop offset="100%" stop-color="#1c0a4a"></stop>
    </radialGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#e9defc"></stop>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7af9d2"></stop>
      <stop offset="100%" stop-color="#3ad6ff"></stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"></feGaussianBlur>
      <feOffset dx="0" dy="14" result="off"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  
  <rect width="1024" height="1024" fill="url(#bg)"></rect>
  <ellipse cx="380" cy="280" rx="320" ry="200" fill="#ffffff" opacity="0.10"></ellipse>

  
  <g transform="translate(102.4 102.4) scale(0.8)">
    <g filter="url(#glow)" opacity="0.55">
      <rect x="320" y="220" width="384" height="540" rx="22" fill="#ff7af0"></rect>
    </g>

    <g filter="url(#paperShadow)">
      <path d="M 320 220 L 704 220 L 704 760 L 672 740 L 640 760 L 608 740 L 576 760 L 544 740 L 512 760 L 480 740 L 448 760 L 416 740 L 384 760 L 352 740 L 320 760 Z" fill="url(#paper)"></path>
      <rect x="360" y="290" width="304" height="22" rx="11" fill="#cfb8f5" opacity="0.85"></rect>
      <rect x="360" y="340" width="220" height="16" rx="8" fill="#ddd0f5"></rect>
      <rect x="360" y="376" width="260" height="16" rx="8" fill="#ddd0f5"></rect>
      <rect x="360" y="412" width="180" height="16" rx="8" fill="#ddd0f5"></rect>
      <rect x="360" y="448" width="240" height="16" rx="8" fill="#ddd0f5"></rect>
      <rect x="360" y="500" width="304" height="4" rx="2" fill="#a78bdc" opacity="0.6"></rect>
      <rect x="360" y="520" width="120" height="22" rx="6" fill="#5b2bd9" opacity="0.85"></rect>
      <rect x="544" y="520" width="120" height="22" rx="6" fill="#5b2bd9"></rect>
    </g>

    <g filter="url(#glow)">
      <circle cx="700" cy="700" r="150" fill="#3ad6ff" opacity="0.55"></circle>
    </g>
    <circle cx="700" cy="700" r="148" fill="#0e0a1a"></circle>
    <circle cx="700" cy="700" r="138" fill="url(#check)"></circle>
    <path d="M 632 702 L 686 754 L 770 660" stroke="#0e0a1a" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
  </g>
</svg>